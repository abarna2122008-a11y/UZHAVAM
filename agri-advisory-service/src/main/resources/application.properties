spring.application.name=agri-advisory-service
server.port=8082
server.error.include-message=always
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.ai.openai.base-url=${GEMINI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${GOOGLE_API_KEY:local-dev-key-not-configured}
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.openai.chat.options.temperature=0.2
services.portal-url=${PORTAL_SERVICE_URL:http://localhost:8081}
plant-vision.model=${GEMINI_MODEL:gemini-3.8-flash}
plant-vision.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
