services:
  postgres-db:
    image: postgres:15.10-alpine
    environment:
      POSTGRES_DB: agridb
      POSTGRES_USER: ${POSTGRES_USER:-agri_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agri-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  agri-portal-service:
    build:
      context: .
      dockerfile: agri-portal-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/agridb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agri_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
      SERVER_PORT: 8081
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - agri-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  farmer-workspace-service:
    build:
      context: .
      dockerfile: farmer-workspace-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/agridb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agri_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    networks:
      - agri-backend
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 35s
    restart: unless-stopped

  agri-advisory-service:
    build:
      context: .
      dockerfile: agri-advisory-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-local-dev-key-not-configured}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      FARMER_WORKSPACE_URL: http://farmer-workspace-service:8083
      PORTAL_SERVICE_URL: http://agri-portal-service:8081
    depends_on:
      agri-portal-service:
        condition: service_healthy
      farmer-workspace-service:
        condition: service_healthy
    networks:
      - agri-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      GATEWAY_USER: ${GATEWAY_USER:-farmer}
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-change-this-dev-password}
      PORTAL_SERVICE_URL: http://agri-portal-service:8081
      ADVISORY_SERVICE_URL: http://agri-advisory-service:8082
      FARMER_WORKSPACE_URL: http://farmer-workspace-service:8083
    depends_on:
      agri-portal-service:
        condition: service_healthy
      agri-advisory-service:
        condition: service_healthy
      farmer-workspace-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - agri-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  agri-backend:
    driver: bridge

volumes:
  postgres_data:
