spring.application.name=farmer-workspace-service
server.port=8083
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agridb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agri_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-this-db-password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-message=never
