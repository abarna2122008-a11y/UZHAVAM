services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    networks:
      - farmer-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agridb
      POSTGRES_USER: ${POSTGRES_USER:-agri_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - farmer-network
    restart: unless-stopped

  portal-service:
    build:
      context: .
      dockerfile: agri-portal-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/agridb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agri_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - farmer-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  advisory-service:
    build:
      context: .
      dockerfile: agri-advisory-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-local-dev-key-not-configured}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      PORTAL_SERVICE_URL: http://portal-service:8081
    depends_on:
      portal-service:
        condition: service_healthy
    networks:
      - farmer-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  api-gateway-service:
    build:
      context: .
      dockerfile: api-gateway-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      GATEWAY_USER: ${GATEWAY_USER:-farmer}
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-change-this-gateway-password}
      PORTAL_SERVICE_URL: http://portal-service:8081
      ADVISORY_SERVICE_URL: http://advisory-service:8082
    depends_on:
      portal-service:
        condition: service_healthy
      advisory-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - farmer-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  farmer-network:
    driver: bridge

volumes:
  postgres_data:
